[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
; addopts = -p no:warnings
env =
    TESTING=1
    JWT_ACCESS_SECRET=pytest-access-secret-32-bytes-minimum-2026
    JWT_REFRESH_SECRET=pytest-refresh-secret-32-bytes-minimum-2026

addopts =
    -ra
    --strict-markers
    --reuse-db
    --tb=short

markers =
    unit
    service
    integration
    performance
    concurrency
    e2e
    slow
