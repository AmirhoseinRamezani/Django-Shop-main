{% extends 'dashboard/admin/base.html' %}
{% load static %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb breadcrumb-light mb-0">
        <li class="breadcrumb-item">حساب</li>
        <li class="breadcrumb-item active" aria-current="page">
            داشبورد ادمین
        </li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<!-- Card -->
<div class="card">
    <!-- Header -->
    <div class="card-header border-bottom">
        <h5 class="card-header-title">خلاصه داشبورد</h5>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div class="card-body">
        <div class="row">

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>کل سفارش‌ها</h6>
                        <strong>{{ total_orders }}</strong>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>سفارش موفق</h6>
                        <strong>{{ successful_orders }}</strong>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>درآمد کل</h6>
                        <strong class="formatted-price">{{ total_revenue }}</strong>
                    </div>
                </div>
            </div>

        </div>
        <!-- End Row -->

    </div>
    <!-- End Body -->
</div>
<!-- End Card -->
{% endblock %}
